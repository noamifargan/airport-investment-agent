[project]
name = "airport-agent"
version = "0.1.0"
description = "AI agent that ranks and compares US airports for terminal-modernization investment using public aviation APIs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
airport-agent = "airport_agent:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
